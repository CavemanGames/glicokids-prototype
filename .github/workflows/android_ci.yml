name: Android Test & Build

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]

jobs:
  test:
    name: Unit Tests (JUnit)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    # Must match gradle/gradle-daemon-jvm.properties (MICROSOFT 17). Any other
    # JDK here only launches the wrapper: Gradle would then download the
    # Microsoft JDK 17 from api.foojay.io on every run to host the daemon.
    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'microsoft'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests (Happy and Fail Paths)
      run: ./gradlew test

    - name: Verify Test Coverage
      run: |
        echo "Verificando se todos os testes passaram..."
        ./gradlew testDebugUnitTest

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    # Must match gradle/gradle-daemon-jvm.properties (MICROSOFT 17). Any other
    # JDK here only launches the wrapper: Gradle would then download the
    # Microsoft JDK 17 from api.foojay.io on every run to host the daemon.
    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'microsoft'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: glicokids-prototype-debug
        path: app/build/outputs/apk/debug/*.apk
